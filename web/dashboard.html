<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Hub</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
  --accent: #2f5bd3; --accent-soft: #e7edfb;
  --ok: #2e7d4f; --warn: #b26a00; --err: #c0392b; --info: #5a6b85; --part: #2f6fa3;
  --ok-soft: #e3f2e8; --warn-soft: #fbf0dc; --err-soft: #fbe5e2; --info-soft: #e9edf3; --part-soft: #e2eef8;
  --bar: #9db3ea; --bar-hot: #2f5bd3;
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a9993; --line: #33322e;
    --accent: #8aa6f0; --accent-soft: #23293a;
    --ok: #6cc28f; --warn: #e3a64a; --err: #ef7d70; --info: #9fb0c9; --part: #7fb4dd;
    --ok-soft: #1d2e24; --warn-soft: #33281a; --err-soft: #3a211e; --info-soft: #232831; --part-soft: #1c2a36;
    --bar: #3d4f7d; --bar-hot: #8aa6f0;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a9993; --line: #33322e;
  --accent: #8aa6f0; --accent-soft: #23293a;
  --ok: #6cc28f; --warn: #e3a64a; --err: #ef7d70; --info: #9fb0c9; --part: #7fb4dd;
  --ok-soft: #1d2e24; --warn-soft: #33281a; --err-soft: #3a211e; --info-soft: #232831; --part-soft: #1c2a36;
  --bar: #3d4f7d; --bar-hot: #8aa6f0;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
header h1 { margin: 0; font-size: 22px; letter-spacing: .01em; }
header .meta { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }
a.ghost { text-decoration: none; display: inline-block; }

.stale { background: var(--warn-soft); color: var(--warn); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
.stale code { background: rgba(0,0,0,0.06); padding: 1px 6px; border-radius: 4px; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; text-align: left; }
.tile:hover { border-color: var(--muted); }
.tile .n { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .l { color: var(--muted); font-size: 13px; }
.platforms { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
.platforms span { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.platforms b { color: var(--ink); font-weight: 600; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.view[hidden] { display: none; }
.dtable-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
.dtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.dtable th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.dtable td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; min-width: 6em; }
.dtable tr:first-child td { border-top: 0; }
.dtable td:first-child { font-weight: 600; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar input[type=search] { flex: 1 1 240px; min-width: 0; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.toolbar select { padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin: 4px 0 10px; align-items: center; }
.legend .k { display: inline-flex; align-items: center; gap: 6px; }
.legend .bars { display: inline-flex; gap: 2px; align-items: flex-end; }
.legend .bars i { display: block; width: 5px; height: 10px; border-radius: 1px; background: var(--bar); }
.legend .bars i.hot { background: var(--bar-hot); }

.list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.group-title { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 8px; font-size: 15px; }
.group-title:first-child { margin-top: 0; }
.group-title small { color: var(--muted); font-weight: 400; font-size: 13px; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) 96px 70px 132px 92px; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover, .row:focus-visible { background: var(--accent-soft); outline: none; }
.row .name { font-weight: 600; overflow-wrap: anywhere; }
.row .sum { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.row .ver { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.row .last { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.head { cursor: default; font-size: 12px; color: var(--muted); padding-top: 8px; padding-bottom: 8px; }
.head:hover { background: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
.dot.warn { background: var(--warn); } .dot.error { background: var(--err); }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--info-soft); color: var(--info); margin-left: 6px; font-weight: 500; vertical-align: 1px; }
.sec { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.sec.passed { background: var(--ok-soft); color: var(--ok); }
.sec.partial { background: var(--part-soft); color: var(--part); }
.sec.stale { background: var(--warn-soft); color: var(--warn); }
.sec.failed { background: var(--err-soft); color: var(--err); }
.sec.none { background: var(--info-soft); color: var(--info); }
.sec.none.third { background: var(--warn-soft); color: var(--warn); }
.spark { display: block; }
.empty { padding: 32px; text-align: center; color: var(--muted); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2[hidden] { display: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card h2 { font-size: 15px; margin: 0 0 4px; overflow-wrap: anywhere; }
.card p.sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.card table { width: 100%; border-collapse: collapse; font-size: 13px; }
.card td { padding: 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
.card td:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
section.more { margin-top: 28px; }

.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.proj .stats { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer; }
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.unmanaged { cursor: default; border-style: dashed; color: var(--muted); }
.pill.unmanaged:hover { border-color: var(--line); }
.pill b { font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 4px; }

.setup dl { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.setup dt { color: var(--muted); }
.setup dd { margin: 0; overflow-wrap: anywhere; }
.setup ol { margin: 0; padding-left: 20px; font-size: 14px; }
.setup ol li { margin-bottom: 8px; }
.setup pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font-size: 12.5px; margin: 6px 0 0; }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); }

/* 詳細面板 */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .15s; }
.scrim.open { opacity: 1; pointer-events: auto; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .2s ease; overflow-y: auto; padding: 20px 20px 48px; }
aside.open { transform: none; }
aside .close { position: sticky; top: 0; float: right; }
aside h2 { margin: 0 0 2px; font-size: 20px; overflow-wrap: anywhere; }
aside h3 { font-size: 13px; color: var(--muted); margin: 22px 0 8px; font-weight: 600; letter-spacing: .02em; }
aside .desc { white-space: pre-wrap; font-size: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.cmd { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px 3px 10px; }
.cmd button { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 8px; cursor: pointer; font-size: 12px; }
.trig { display: flex; flex-wrap: wrap; gap: 6px; }
.trig span { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 13px; }
.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.issues li { border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.issues .error { background: var(--err-soft); color: var(--err); }
.issues .warn { background: var(--warn-soft); color: var(--warn); }
.issues .info { background: var(--info-soft); color: var(--info); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 12px 8px; font-size: 13px; }
.timeline li::before { content: ""; position: absolute; left: -21px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.timeline .v { font-family: var(--mono); font-weight: 600; }
.timeline .d { color: var(--muted); margin-left: 6px; }
.outline { margin: 0; padding-left: 18px; font-size: 13px; columns: 2; column-gap: 24px; }
.plat { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; font-size: 13px; }
.plat .m { color: var(--muted); }

@media (max-width: 860px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row { grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; }
  .row .ver, .row .sparkcell, .row .last { display: none; }
  .head { display: none; }
  .grid2 { grid-template-columns: 1fr; }
  .outline { columns: 1; }
  .setup dl { grid-template-columns: 1fr; gap: 0 0; }
  .setup dd { margin-bottom: 8px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Skill Hub</h1>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <span class="meta" id="updstate" role="status"></span>
    <a class="ghost" id="update" href="skillhub://update" title="重新讀取 skill 與使用紀錄（需先執行 skill-hub protocol install）">更新資料</a>
    <button class="ghost" id="theme" type="button">切換深淺色</button>
  </header>

  <div class="stale" id="stale" hidden></div>
  <div class="stale" id="updhelp" hidden></div>
  <div class="tiles" id="tiles"></div>
  <div class="platforms" id="platforms"></div>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-view="skills" aria-selected="true">Skill 清單</button>
    <button class="tab" role="tab" data-view="categories" aria-selected="false">依分類</button>
    <button class="tab" role="tab" data-view="projects" aria-selected="false">依專案</button>
    <button class="tab" role="tab" data-view="setup" aria-selected="false">設定與說明</button>
  </nav>

  <!-- Skill 清單、依分類共用同一組篩選 -->
  <div id="filters">
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜尋名稱、用途、觸發詞…" aria-label="搜尋">
      <select id="category" aria-label="分類"></select>
      <select id="sort" aria-label="排序">
        <option value="lastUsed">最近使用</option>
        <option value="uses">使用次數（近 90 天）</option>
        <option value="updated">最近更新</option>
        <option value="name">名稱</option>
        <option value="health">健檢狀態</option>
        <option value="security">資安狀態</option>
      </select>
      <select id="source" aria-label="來源"></select>
    </div>
    <div class="toolbar"><div class="chips" id="chips"></div></div>
    <div class="legend" id="legend">
      <span class="k"><span class="dot"></span>健檢正常</span>
      <span class="k"><span class="dot warn"></span>有警告</span>
      <span class="k"><span class="dot error"></span>有錯誤</span>
      <span class="k"><span class="bars"><i></i><i></i><i class="hot"></i></span>近 26 週使用次數（深色＝最近 4 週）</span>
      <span class="k"><span class="sec passed">已檢查</span><span class="sec partial">部分檢查</span><span class="sec stale">需重審</span><span class="sec none">未檢查</span>資安審查</span>
    </div>
  </div>

  <section class="view" id="view-skills"><div class="list" id="list" role="list"></div></section>
  <section class="view" id="view-categories" hidden></section>
  <section class="view" id="view-projects" hidden></section>
  <section class="view setup" id="view-setup" hidden></section>

  <section class="more grid2" id="more">
    <div class="card">
      <h2>健檢總覽</h2>
      <p class="sub">各規則命中的 skill 數；點規則名稱可篩選</p>
      <table id="rules"></table>
    </div>
    <div class="card">
      <h2>未納管的 skill</h2>
      <p class="sub">有使用紀錄、但不在任何來源 repo 裡（平台內建或另外安裝）</p>
      <table id="unmanaged"></table>
    </div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true" tabindex="-1"></aside>

<script>
const R = /*__REPORT__*/null;
const DAY = 86400000;
const NOW = Date.parse(R.generatedAt);
const PLATFORM = { 'claude-code': 'Claude Code', codex: 'Codex', 'grok-bot': 'Grok Bot' };
const HEALTH = { ok: '正常', warn: '警告', error: '錯誤' };
const SEC = { passed: '已檢查', partial: '部分檢查', stale: '需重審', failed: '未通過', none: '未檢查' };
const CAT_SOURCE = { skill: 'SKILL.md 指定', config: '設定檔指定', auto: '依關鍵字自動判斷', none: '無法判斷' };
const RULE = {
  'no-frontmatter': '缺 frontmatter', 'missing-name': '缺 name', 'name-mismatch': 'name 與資料夾不同', 'not-kebab': '資料夾非 kebab-case',
  'missing-description': '缺 description', 'description-too-long': 'description 過長', 'no-triggers': '沒有觸發關鍵字',
  'missing-version': '缺版本號', 'bad-version': '版本號格式錯', 'body-too-long': '本文過長', 'missing-source': '第三方缺 source',
  'missing-source-commit': '第三方缺 source_commit', 'missing-license': '第三方缺 license', 'missing-author': '第三方缺作者', secret: '疑似含密鑰',
  'hidden-chars': '含隱藏字元', 'review-failed': '資安審查未通過', 'review-stale': '資安審查後有修改', 'not-reviewed': '第三方未做資安審查',
  'risky-scripts': '腳本含連網／執行／寫檔', 'no-bump': '改了沒升版號', uncommitted: '有未 commit 修改', 'changelog-stale': 'changelog 沒跟上',
  'never-used': '從未使用', unused: '久未使用', 'trigger-overlap': '觸發詞重疊', 'duplicate-name': '名稱重複',
  'upstream-behind': '上游有新版', 'upstream-unreachable': '上游連不到',
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pname = (p) => PLATFORM[p] || p;
function ago(iso) {
  if (!iso) return '—';
  const d = Math.floor((NOW - Date.parse(iso)) / DAY);
  if (d <= 0) return '今天';
  if (d < 30) return `${d} 天前`;
  if (d < 365) return `${Math.floor(d / 30)} 個月前`;
  return `${Math.floor(d / 365)} 年前`;
}
const day = (iso) => (iso ? String(iso).slice(0, 10) : '—');
const used = (s, days) => !!s.usage?.lastUsed && NOW - Date.parse(s.usage.lastUsed) <= days * DAY;
const byName = new Map(R.skills.map((s) => [s.name || s.folder, s]));
const anyUsage = Object.keys(R.platforms).length > 0;
const secBadge = (s) => `<span class="sec ${s.security.status}${s.thirdParty ? ' third' : ''}" title="資安審查：${SEC[s.security.status]}${s.security.review ? `（${s.security.review.date}）` : ''}">${SEC[s.security.status]}</span>`;

function spark(weekly, w = 132, h = 26) {
  if (!weekly) return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true"><line x1="0" y1="${h - 1}" x2="${w}" y2="${h - 1}" stroke="var(--line)"/></svg>`;
  const max = Math.max(1, ...weekly);
  const bw = w / weekly.length;
  const bars = weekly.map((v, i) => {
    const bh = v ? Math.max(2, (v / max) * (h - 2)) : 0;
    return bh ? `<rect x="${(i * bw + 0.5).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw - 1).toFixed(1)}" height="${bh.toFixed(1)}" rx="1" fill="${i >= weekly.length - 4 ? 'var(--bar-hot)' : 'var(--bar)'}"/>` : '';
  }).join('');
  return `<svg class="spark" width="${w}" height="${h}" role="img" aria-label="近 26 週使用：${weekly.reduce((a, b) => a + b, 0)} 次"><line x1="0" y1="${h - 0.5}" x2="${w}" y2="${h - 0.5}" stroke="var(--line)"/>${bars}</svg>`;
}

// ---- 狀態 ----
const state = { view: 'skills', q: '', sort: 'lastUsed', source: '', category: '', filter: 'all', rule: '', tableViews: {} };
const FILTERS = [
  ['all', '全部'], ['attention', '需處理'], ['recent', '近 30 天有用'], ['idle', `${R.thresholds.unusedDays} 天沒用`],
  ['never', '從未使用'], ['reviewed', '資安已檢查'], ['unreviewed', '資安未檢查／需重審'], ['third', '第三方'], ['own', '自建'],
];

function matches(s) {
  if (state.source && s.source !== state.source) return false;
  if (state.category && s.category !== state.category) return false;
  if (state.rule && !s.issues.some((i) => i.code === state.rule)) return false;
  const st = s.security.status;
  switch (state.filter) {
    case 'attention': if (s.health === 'ok') return false; break;
    case 'recent': if (!used(s, 30)) return false; break;
    case 'idle': if (!s.usage || used(s, R.thresholds.unusedDays)) return false; break;
    case 'never': if (s.usage) return false; break;
    case 'reviewed': if (st !== 'passed' && st !== 'partial') return false; break;
    case 'unreviewed': if (st === 'passed' || st === 'partial') return false; break;
    case 'third': if (!s.thirdParty) return false; break;
    case 'own': if (s.thirdParty) return false; break;
  }
  if (!state.q) return true;
  const hay = [s.name, s.folder, s.description, s.triggers.join(' '), s.layer, s.source, s.category].join(' ').toLowerCase();
  return state.q.toLowerCase().split(/\s+/).filter(Boolean).every((t) => hay.includes(t));
}
const rank = { error: 0, warn: 1, ok: 2 };
const secRank = { failed: 0, stale: 1, none: 2, partial: 3, passed: 4 };
const sorters = {
  lastUsed: (a, b) => (b.usage?.lastUsed || '').localeCompare(a.usage?.lastUsed || '') || a.folder.localeCompare(b.folder),
  uses: (a, b) => (b.usage?.last90 || 0) - (a.usage?.last90 || 0) || (b.usage?.total || 0) - (a.usage?.total || 0),
  updated: (a, b) => (b.lastModified || '').localeCompare(a.lastModified || ''),
  name: (a, b) => a.folder.localeCompare(b.folder),
  health: (a, b) => rank[a.health] - rank[b.health] || b.issues.length - a.issues.length,
  security: (a, b) => secRank[a.security.status] - secRank[b.security.status] || Number(b.thirdParty) - Number(a.thirdParty) || a.folder.localeCompare(b.folder),
};

// 網頁是 build 當下的快照；打開時距離產生超過一天就提醒更新（用開啟當下的時間比較）
function renderStale() {
  const hours = (Date.now() - NOW) / 3600000;
  if (hours < 24) return;
  const el = document.getElementById('stale');
  el.hidden = false;
  el.innerHTML = `這份資料是 ${Math.floor(hours / 24)} 天前產生的，之後的使用紀錄與 skill 修改不會顯示。更新：在 skill-hub 資料夾執行 <code>node bin/skill-hub.mjs build --open</code>，或按右上角的「更新資料」。`;
}

// 「更新資料」按鈕連到 skillhub://update，由 Windows 執行 update-dashboard.cmd /web 重新 build（skill-hub protocol install 設定）。
// 網頁讀不到本機檔案，所以用隱藏的 iframe 每 2 秒載入一次這個檔案，產生時間變了就重新整理整頁。
const IS_TOP = window.top === window;
if (!IS_TOP) { try { parent.postMessage({ skillhub: R.generatedAt }, '*'); } catch {} }
const UPDATE_WAIT = 60000;
let watching = false;
function setUpdateState(text) { document.getElementById('updstate').textContent = text; }
function watchForUpdate() {
  if (watching) return;
  watching = true;
  document.getElementById('updhelp').hidden = true;
  setUpdateState('更新中…');
  const from = R.generatedAt;
  const started = Date.now();
  const base = location.href.split(/[?#]/)[0];
  const frame = document.createElement('iframe');
  frame.hidden = true;
  frame.title = '檢查是否已更新';
  document.body.append(frame);
  const stop = () => { clearInterval(timer); window.removeEventListener('message', onMessage); frame.remove(); watching = false; };
  const onMessage = (e) => {
    if (e.source !== frame.contentWindow || typeof e.data?.skillhub !== 'string' || e.data.skillhub === from) return;
    stop();
    try { sessionStorage.setItem('skillhub.updated', '1'); } catch {}
    location.reload();
  };
  window.addEventListener('message', onMessage);
  const timer = setInterval(() => {
    if (Date.now() - started > UPDATE_WAIT) {
      stop();
      setUpdateState('');
      const help = document.getElementById('updhelp');
      help.hidden = false;
      help.innerHTML = '一分鐘內沒有收到新資料。第一次使用要先在 skill-hub 資料夾執行 <code>node bin/skill-hub.mjs protocol install</code>（只需一次，目前只支援 Windows）；已經設定過的話，請看 <code>out/last-build.log</code> 的錯誤訊息。';
      return;
    }
    frame.src = `${base}?probe=${Date.now()}`;
  }, 2000);
}
function renderUpdated() {
  let updated = false;
  try { updated = sessionStorage.getItem('skillhub.updated') === '1'; sessionStorage.removeItem('skillhub.updated'); } catch {}
  if (!updated) return;
  setUpdateState('已更新');
  setTimeout(() => setUpdateState(''), 4000);
}

function securityHtml(s) {
  const sec = s.security;
  const r = sec.review;
  const scan = sec.scan;
  const lines = [];
  if (r) {
    lines.push(`<dt>結果</dt><dd>${secBadge(s)} ${r.result === 'pass' ? '通過' : '未通過'}・${r.scope === 'partial' ? '部分審查' : '完整審查'}</dd>`);
    lines.push(`<dt>日期</dt><dd>${esc(r.date)}${r.version ? `・當時版本 ${esc(r.version)}` : ''}${r.ref ? `・上游 <span class="mono">${esc(r.ref)}</span>` : ''}</dd>`);
    if (r.source || r.author) lines.push(`<dt>審查對象</dt><dd>${esc(r.author || '作者未知')}・${r.source ? `<a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">${esc(r.source)}</a>` : '自建'}</dd>`);
    if (r.note) lines.push(`<dt>說明</dt><dd>${esc(r.note)}</dd>`);
    if (sec.changedSince) lines.push(`<dt>之後</dt><dd class="warn-t">審查後又修改了 ${sec.changedSince} 次，需要重新審查</dd>`);
    if (sec.history.length > 1) lines.push(`<dt>歷次</dt><dd>${sec.history.map((h) => `${esc(h.date)} ${h.result === 'pass' ? '通過' : '未通過'}`).join('、')}</dd>`);
  } else {
    lines.push(`<dt>結果</dt><dd>${secBadge(s)} ${s.thirdParty ? '第三方 skill，建議照審查流程檢查後再用' : '自建 skill，沒有審查紀錄'}</dd>`);
  }
  const scripts = scan.scripts.length ? scan.scripts.map((x) => `<span class="mono">${esc(x.file)}</span>${x.risks.length ? `（${x.risks.join('、')}）` : ''}`).join('<br>') : '沒有腳本';
  lines.push(`<dt>自動掃描</dt><dd>密鑰 ${scan.secrets.length ? `<span class="warn-t">${scan.secrets.length} 個檔案</span>` : '無'}・隱藏字元 ${scan.hidden.length ? `<span class="warn-t">${scan.hidden.length} 個檔案</span>` : '無'}</dd>`);
  lines.push(`<dt>腳本</dt><dd>${scripts}</dd>`);
  return `<h3>資安</h3><dl class="kv">${lines.join('')}</dl><p style="color:var(--muted);font-size:12px;margin:6px 0 0">自動掃描只是初篩，「已檢查」以人工審查紀錄為準。</p>`;
}

}
function renderTable(i) {
  const t = TABLES[i];
  const j = Math.min(state.tableViews[i] || 0, t.views.length - 1);
  const v = t.views[j];
  document.getElementById(`view-table-${i}`).innerHTML = `
    ${t.description ? `<p style="color:var(--muted);font-size:13px;margin:0 0 12px">${esc(t.description)}</p>` : ''}
    ${t.views.length > 1 ? `<div class="toolbar"><div class="chips">${t.views.map((x, k) => `<button class="chip" type="button" data-tview="${i}:${k}" aria-pressed="${k === j}">${esc(x.title)}</button>`).join('')}</div></div>` : ''}
    ${v.note ? `<p style="color:var(--muted);font-size:13px;margin:0 0 10px">${esc(v.note)}</p>` : ''}
    <div class="dtable-wrap">${v.rows.length
      ? `<table class="dtable"><thead><tr>${v.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${v.rows.map((r) => `<tr>${v.columns.map((_, k) => `<td>${esc(r[k] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table>`
      : '<div class="empty">沒有資料</div>'}</div>`;
}

function setView(v) {
  state.view = v;
  for (const t of document.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.view === v));
  for (const id of VIEWS) document.getElementById(`view-${id}`).hidden = id !== v;
  document.getElementById('filters').hidden = !['skills', 'categories'].includes(v);
  document.getElementById('more').hidden = v === 'setup' || v.startsWith('table-');
  try { localStorage.setItem('skillhub.view', v); } catch {}
}

// ---- 事件 ----
function refresh() { renderChips(); renderList(); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-filter],[data-rule],[data-id],[data-close],[data-copy],[data-view],[data-tview]');
  if (!t) return;
  if (t.dataset.tview) {
    const [i, j] = t.dataset.tview.split(':').map(Number);
    state.tableViews[i] = j;
    try { localStorage.setItem('skillhub.tableViews', JSON.stringify(state.tableViews)); } catch {}
    return renderTable(i);
  }
  if (t.dataset.copy !== undefined) { navigator.clipboard?.writeText(t.dataset.copy); t.textContent = '已複製'; setTimeout(() => (t.textContent = '複製'), 1200); return; }
  if (t.dataset.close !== undefined) return closeDrawer();
  if (t.dataset.view) return setView(t.dataset.view);
  if (t.dataset.rule !== undefined) { e.preventDefault(); state.rule = t.dataset.rule; state.filter = 'all'; if (!['skills', 'categories'].includes(state.view)) setView('skills'); refresh(); if (state.rule) document.getElementById('tabs').scrollIntoView({ behavior: 'smooth' }); return; }
  if (t.dataset.filter !== undefined) { state.filter = t.dataset.filter; if (!['skills', 'categories'].includes(state.view)) setView('skills'); return refresh(); }
  if (t.dataset.id) openDrawer(t.dataset.id);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDrawer();
  if (e.key === 'Enter' && e.target.dataset?.id) openDrawer(e.target.dataset.id);
});
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value.trim(); renderList(); });
document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; try { localStorage.setItem('skillhub.sort', state.sort); } catch {} renderList(); });
document.getElementById('source').addEventListener('change', (e) => { state.source = e.target.value; renderList(); });
document.getElementById('category').addEventListener('change', (e) => { state.category = e.target.value; renderList(); });
document.getElementById('update').addEventListener('click', () => watchForUpdate());
document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('skillhub.theme', root.dataset.theme); } catch {}
});

let initialView = 'skills';
try {
  const th = localStorage.getItem('skillhub.theme'); if (th) document.documentElement.dataset.theme = th;
  const so = localStorage.getItem('skillhub.sort'); if (so && sorters[so]) state.sort = so;
  const vw = localStorage.getItem('skillhub.view'); if (VIEWS.includes(vw)) initialView = vw;
  const tv = JSON.parse(localStorage.getItem('skillhub.tableViews') || '{}'); if (tv && typeof tv === 'object') state.tableViews = tv;
} catch {}
document.getElementById('sort').value = state.sort;
renderStale(); if (IS_TOP) renderUpdated(); renderTop(); refresh(); renderProjects(); renderSetup(); renderSide(); renderTables();
setView(initialView);
if (location.hash) openDrawer(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
