<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Hub</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
  --accent: #2f5bd3; --accent-soft: #e7edfb;
  --ok: #2e7d4f; --warn: #b26a00; --err: #c0392b; --info: #5a6b85;
  --ok-soft: #e3f2e8; --warn-soft: #fbf0dc; --err-soft: #fbe5e2; --info-soft: #e9edf3;
  --bar: #9db3ea; --bar-hot: #2f5bd3;
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a9993; --line: #33322e;
    --accent: #8aa6f0; --accent-soft: #23293a;
    --ok: #6cc28f; --warn: #e3a64a; --err: #ef7d70; --info: #9fb0c9;
    --ok-soft: #1d2e24; --warn-soft: #33281a; --err-soft: #3a211e; --info-soft: #232831;
    --bar: #3d4f7d; --bar-hot: #8aa6f0;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a9993; --line: #33322e;
  --accent: #8aa6f0; --accent-soft: #23293a;
  --ok: #6cc28f; --warn: #e3a64a; --err: #ef7d70; --info: #9fb0c9;
  --ok-soft: #1d2e24; --warn-soft: #33281a; --err-soft: #3a211e; --info-soft: #232831;
  --bar: #3d4f7d; --bar-hot: #8aa6f0;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
header h1 { margin: 0; font-size: 22px; letter-spacing: .01em; }
header .meta { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; text-align: left; }
.tile:hover { border-color: var(--muted); }
.tile .n { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .l { color: var(--muted); font-size: 13px; }
.platforms { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; font-size: 13px; color: var(--muted); }
.platforms span { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.platforms b { color: var(--ink); font-weight: 600; }
.notes { margin: -8px 0 20px; padding: 0; list-style: none; font-size: 13px; color: var(--warn); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar input[type=search] { flex: 1 1 240px; min-width: 0; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.toolbar select { padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) 78px 132px 96px; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover, .row:focus-visible { background: var(--accent-soft); outline: none; }
.row .name { font-weight: 600; overflow-wrap: anywhere; }
.row .sum { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.row .ver { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.row .last { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.head { cursor: default; font-size: 12px; color: var(--muted); padding-top: 8px; padding-bottom: 8px; }
.head:hover { background: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
.dot.warn { background: var(--warn); } .dot.error { background: var(--err); }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--info-soft); color: var(--info); margin-left: 6px; font-weight: 500; vertical-align: 1px; }
.spark { display: block; }
.empty { padding: 32px; text-align: center; color: var(--muted); }

section.more { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card h2 { font-size: 15px; margin: 0 0 4px; }
.card p.sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.card table { width: 100%; border-collapse: collapse; font-size: 13px; }
.card td { padding: 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
.card td:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }

/* 詳細面板 */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .15s; }
.scrim.open { opacity: 1; pointer-events: auto; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .2s ease; overflow-y: auto; padding: 20px 20px 48px; }
aside.open { transform: none; }
aside .close { position: sticky; top: 0; float: right; }
aside h2 { margin: 0 0 2px; font-size: 20px; overflow-wrap: anywhere; }
aside h3 { font-size: 13px; text-transform: none; color: var(--muted); margin: 22px 0 8px; font-weight: 600; letter-spacing: .02em; }
aside .desc { white-space: pre-wrap; font-size: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.cmd { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px 3px 10px; }
.cmd button { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 8px; cursor: pointer; font-size: 12px; }
.trig { display: flex; flex-wrap: wrap; gap: 6px; }
.trig span { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 13px; }
.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.issues li { border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.issues .error { background: var(--err-soft); color: var(--err); }
.issues .warn { background: var(--warn-soft); color: var(--warn); }
.issues .info { background: var(--info-soft); color: var(--info); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 12px 8px; font-size: 13px; }
.timeline li::before { content: ""; position: absolute; left: -21px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.timeline .v { font-family: var(--mono); font-weight: 600; }
.timeline .d { color: var(--muted); margin-left: 6px; }
.outline { margin: 0; padding-left: 18px; font-size: 13px; columns: 2; column-gap: 24px; }
.plat { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; font-size: 13px; }
.plat .m { color: var(--muted); }

@media (max-width: 760px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row { grid-template-columns: 12px minmax(0, 1fr) 84px; gap: 10px; }
  .row .ver, .row .sparkcell { display: none; }
  .head { display: none; }
  section.more { grid-template-columns: 1fr; }
  .outline { columns: 1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Skill Hub</h1>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <button class="ghost" id="theme" type="button">切換深淺色</button>
  </header>

  <div class="tiles" id="tiles"></div>
  <div class="platforms" id="platforms"></div>
  <ul class="notes" id="notes"></ul>

  <div class="toolbar">
    <input type="search" id="q" placeholder="搜尋名稱、用途、觸發詞…" aria-label="搜尋">
    <select id="sort" aria-label="排序">
      <option value="lastUsed">最近使用</option>
      <option value="uses">使用次數（近 90 天）</option>
      <option value="updated">最近更新</option>
      <option value="name">名稱</option>
      <option value="health">健檢狀態</option>
    </select>
    <select id="source" aria-label="來源"></select>
  </div>
  <div class="toolbar"><div class="chips" id="chips"></div></div>

  <div class="list" id="list" role="list"></div>

  <section class="more">
    <div class="card">
      <h2>健檢總覽</h2>
      <p class="sub">各規則命中的 skill 數；點列名可篩選</p>
      <table id="rules"></table>
    </div>
    <div class="card">
      <h2>未納管的 skill</h2>
      <p class="sub">有使用紀錄、但不在任何來源 repo 裡（平台內建或另外安裝）</p>
      <table id="unmanaged"></table>
    </div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true" tabindex="-1"></aside>

<script>
const R = /*__REPORT__*/null;
const DAY = 86400000;
const NOW = Date.parse(R.generatedAt);
const PLATFORM = { 'claude-code': 'Claude Code', codex: 'Codex', 'grok-bot': 'Grok Bot' };
const HEALTH = { ok: '正常', warn: '警告', error: '錯誤' };
const RULE = {
  'no-frontmatter': '缺 frontmatter', 'missing-name': '缺 name', 'name-mismatch': 'name 與資料夾不同', 'not-kebab': '資料夾非 kebab-case',
  'missing-description': '缺 description', 'description-too-long': 'description 過長', 'no-triggers': '沒有觸發關鍵字',
  'missing-version': '缺版本號', 'bad-version': '版本號格式錯', 'body-too-long': '本文過長', 'missing-source': '第三方缺 source',
  'missing-source-commit': '第三方缺 source_commit', 'missing-license': '第三方缺 license', secret: '疑似含密鑰',
  'no-bump': '改了沒升版號', uncommitted: '有未 commit 修改', 'changelog-stale': 'changelog 沒跟上',
  'never-used': '從未使用', unused: '久未使用', 'trigger-overlap': '觸發詞重疊', 'duplicate-name': '名稱重複',
  'upstream-behind': '上游有新版', 'upstream-unreachable': '上游連不到',
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pname = (p) => PLATFORM[p] || p;
function ago(iso) {
  if (!iso) return '—';
  const d = Math.floor((NOW - Date.parse(iso)) / DAY);
  if (d <= 0) return '今天';
  if (d < 30) return `${d} 天前`;
  if (d < 365) return `${Math.floor(d / 30)} 個月前`;
  return `${Math.floor(d / 365)} 年前`;
}
const day = (iso) => (iso ? iso.slice(0, 10) : '—');
const used = (s, days) => !!s.usage?.lastUsed && NOW - Date.parse(s.usage.lastUsed) <= days * DAY;

function spark(weekly, w = 132, h = 26) {
  if (!weekly) return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true"><line x1="0" y1="${h - 1}" x2="${w}" y2="${h - 1}" stroke="var(--line)"/></svg>`;
  const max = Math.max(1, ...weekly);
  const bw = w / weekly.length;
  const bars = weekly.map((v, i) => {
    const bh = v ? Math.max(2, (v / max) * (h - 2)) : 0;
    return bh ? `<rect x="${(i * bw + 0.5).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw - 1).toFixed(1)}" height="${bh.toFixed(1)}" rx="1" fill="${i >= weekly.length - 4 ? 'var(--bar-hot)' : 'var(--bar)'}"/>` : '';
  }).join('');
  return `<svg class="spark" width="${w}" height="${h}" role="img" aria-label="近 26 週使用：${weekly.reduce((a, b) => a + b, 0)} 次"><line x1="0" y1="${h - 0.5}" x2="${w}" y2="${h - 0.5}" stroke="var(--line)"/>${bars}</svg>`;
}

// ---- 狀態 ----
const state = { q: '', sort: 'lastUsed', source: '', filter: 'all', rule: '' };
const FILTERS = [
  ['all', '全部'], ['attention', '需處理'], ['recent', '近 30 天有用'], ['idle', `${R.thresholds.unusedDays} 天沒用`],
  ['never', '從未使用'], ['third', '第三方'], ['own', '自建'],
];
const anyUsage = Object.keys(R.platforms).length > 0;

function matches(s) {
  if (state.source && s.source !== state.source) return false;
  if (state.rule && !s.issues.some((i) => i.code === state.rule)) return false;
  switch (state.filter) {
    case 'attention': if (s.health === 'ok') return false; break;
    case 'recent': if (!used(s, 30)) return false; break;
    case 'idle': if (!s.usage || used(s, R.thresholds.unusedDays)) return false; break;
    case 'never': if (s.usage) return false; break;
    case 'third': if (!s.upstream) return false; break;
    case 'own': if (s.upstream) return false; break;
  }
  if (!state.q) return true;
  const hay = [s.name, s.folder, s.description, s.triggers.join(' '), s.layer, s.source].join(' ').toLowerCase();
  return state.q.toLowerCase().split(/\s+/).filter(Boolean).every((t) => hay.includes(t));
}
const rank = { error: 0, warn: 1, ok: 2 };
const sorters = {
  lastUsed: (a, b) => (b.usage?.lastUsed || '').localeCompare(a.usage?.lastUsed || '') || a.folder.localeCompare(b.folder),
  uses: (a, b) => (b.usage?.last90 || 0) - (a.usage?.last90 || 0) || (b.usage?.total || 0) - (a.usage?.total || 0),
  updated: (a, b) => (b.lastModified || '').localeCompare(a.lastModified || ''),
  name: (a, b) => a.folder.localeCompare(b.folder),
  health: (a, b) => rank[a.health] - rank[b.health] || b.issues.length - a.issues.length,
};

function renderTop() {
  const S = R.skills;
  document.getElementById('meta').textContent = `${R.sources.map((s) => `${s.name}（${s.skills}）`).join('、')}・產生於 ${R.generatedAt.slice(0, 16).replace('T', ' ')}`;
  const tiles = [
    ['all', S.length, 'skill 總數'],
    ['recent', S.filter((s) => used(s, 30)).length, '近 30 天有用到'],
    ['never', anyUsage ? S.filter((s) => !s.usage).length : '—', '從未使用'],
    ['attention', S.filter((s) => s.health !== 'ok').length, '需處理（錯誤＋警告）'],
  ];
  document.getElementById('tiles').innerHTML = tiles.map(([f, n, l]) => `<button class="tile" type="button" data-filter="${f}"><div class="n">${n}</div><div class="l">${l}</div></button>`).join('');
  const P = Object.entries(R.platforms);
  document.getElementById('platforms').innerHTML = P.length
    ? P.map(([k, v]) => `<span><b>${esc(pname(k))}</b> ${v.events} 次・最後 ${day(v.last)}</span>`).join('')
    : '<span>沒有找到任何使用紀錄</span>';
  document.getElementById('notes').innerHTML = R.notes.map((n) => `<li>${esc(n)}</li>`).join('');
  const srcSel = document.getElementById('source');
  srcSel.innerHTML = `<option value="">全部來源</option>` + R.sources.map((s) => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');
  srcSel.hidden = R.sources.length < 2;
}

function renderChips() {
  document.getElementById('chips').innerHTML = FILTERS.map(([k, l]) => `<button class="chip" type="button" data-filter="${k}" aria-pressed="${state.filter === k}">${l}</button>`).join('')
    + (state.rule ? `<button class="chip" type="button" data-rule="" aria-pressed="true">規則：${esc(RULE[state.rule] || state.rule)} ✕</button>` : '');
}

function renderList() {
  const rows = R.skills.filter(matches).sort(sorters[state.sort]);
  const el = document.getElementById('list');
  if (!rows.length) { el.innerHTML = '<div class="empty">沒有符合條件的 skill</div>'; return; }
  el.innerHTML = `<div class="row head"><span></span><span>Skill</span><span>版本</span><span class="sparkcell">近 26 週使用</span><span class="last">最後使用</span></div>` + rows.map((s) => `
    <div class="row" role="listitem" tabindex="0" data-id="${esc(s.id)}">
      <span class="dot ${s.health}" title="${HEALTH[s.health]}"></span>
      <span><div class="name">${esc(s.name || s.folder)}${s.upstream ? '<span class="tag">第三方</span>' : ''}${s.layer ? `<span class="tag">${esc(s.layer)}</span>` : ''}</div><div class="sum">${esc(s.summary)}</div></span>
      <span class="ver">${esc(s.version || '—')}</span>
      <span class="sparkcell">${spark(s.usage?.weekly)}</span>
      <span class="last">${ago(s.usage?.lastUsed)}</span>
    </div>`).join('');
}

function renderSide() {
  const counts = {};
  for (const s of R.skills) for (const c of new Set(s.issues.map((i) => i.code))) counts[c] = (counts[c] || 0) + 1;
  const rules = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  document.getElementById('rules').innerHTML = rules.length
    ? rules.map(([c, n]) => `<tr><td><a href="#" data-rule="${esc(c)}">${esc(RULE[c] || c)}</a></td><td>${n}</td></tr>`).join('')
    : '<tr><td>全部通過</td><td></td></tr>';
  document.getElementById('unmanaged').innerHTML = R.unmanaged.length
    ? R.unmanaged.slice(0, 15).map((u) => `<tr><td>${esc(u.name)}<br><span style="color:var(--muted)">${u.platforms.map(pname).join('、')}</span></td><td>${u.total} 次<br>${ago(u.lastUsed)}</td></tr>`).join('')
    : '<tr><td>沒有</td><td></td></tr>';
}

function openDrawer(id) {
  const s = R.skills.find((x) => x.id === id);
  if (!s) return;
  const u = s.usage;
  const changelogFor = (v) => s.changelog.find((c) => c.version === v)?.note;
  const versions = s.versions.length
    ? s.versions.map((v) => `<li><span class="v">${esc(v.version)}</span><span class="d">${day(v.date)}</span><div>${esc(changelogFor(v.version) || v.subject)}</div></li>`).join('')
    : s.changelog.map((c) => `<li><span class="v">${esc(c.version || '')}</span><div>${esc(c.note)}</div></li>`).join('');
  const d = document.getElementById('drawer');
  d.innerHTML = `
    <button class="ghost close" type="button" data-close>關閉</button>
    <h2>${esc(s.name || s.folder)}</h2>
    <div style="color:var(--muted);font-size:13px">${esc(s.source)} / ${esc(s.relPath)}・v${esc(s.version || '?')}・${HEALTH[s.health]}</div>

    ${s.issues.length ? `<h3>健檢</h3><ul class="issues">${s.issues.map((i) => `<li class="${i.level}">${esc(i.message)}</li>`).join('')}</ul>` : ''}

    <h3>用途</h3>
    <div class="desc">${esc(s.description || '（沒有 description）')}</div>

    <h3>指令</h3>
    <span class="cmd"><code>${esc(s.command)}</code><button type="button" data-copy="${esc(s.command)}">複製</button></span>
    ${s.triggers.length ? `<h3>觸發關鍵字（${s.triggers.length}）</h3><div class="trig">${s.triggers.map((t) => `<span>${esc(t)}</span>`).join('')}</div>` : ''}

    <h3>使用狀況</h3>
    ${u ? `${spark(u.weekly, 500, 40).replace('class="spark"', 'class="spark" style="max-width:100%"')}
      <div class="plat" style="margin-top:10px">${Object.entries(u.platforms).map(([k, v]) => `<span>${esc(pname(k))}</span><span>${v.count} 次</span><span class="m">最後 ${day(v.last)}</span>`).join('')}</div>
      <dl class="kv" style="margin-top:10px"><dt>近 30／90 天</dt><dd>${u.last30}／${u.last90} 次</dd><dt>累計</dt><dd>${u.total} 次</dd>
      ${u.projects.length ? `<dt>常用專案</dt><dd>${u.projects.map((p) => `${esc(p.name)}（${p.count}）`).join('、')}</dd>` : ''}</dl>`
      : `<div style="color:var(--muted);font-size:13px">${anyUsage ? '統計範圍內沒有使用紀錄' : '沒有收集到使用紀錄'}</div>`}

    ${versions ? `<h3>版本紀錄</h3><ul class="timeline">${versions}</ul>` : ''}

    ${s.commits.length ? `<h3>最近修改</h3><table style="width:100%;font-size:13px;border-collapse:collapse">${s.commits.slice(0, 8).map((c) => `<tr><td class="mono" style="color:var(--muted);padding:3px 8px 3px 0;white-space:nowrap;vertical-align:top">${c.hash.slice(0, 7)}</td><td style="padding:3px 0">${esc(c.subject)}<span style="color:var(--muted)">・${day(c.date)}</span></td></tr>`).join('')}</table>` : ''}

    ${s.outline.length ? `<h3>章節大綱</h3><ol class="outline">${s.outline.map((o) => `<li>${esc(o)}</li>`).join('')}</ol>` : ''}

    <h3>檔案</h3>
    <dl class="kv">
      <dt>本文</dt><dd>${s.bodyLines} 行・共 ${s.fileCount} 個檔案${s.folders.length ? `（${s.folders.join('、')}）` : ''}</dd>
      <dt>最後修改</dt><dd>${day(s.lastModified)}${s.uncommitted ? `・${s.uncommitted} 個檔案未 commit` : ''}</dd>
      ${s.upstream ? `<dt>上游</dt><dd><a href="${esc(s.upstream)}" target="_blank" rel="noopener noreferrer">${esc(s.upstream)}</a></dd><dt>對齊 commit</dt><dd class="mono">${esc(s.upstreamCommit || '—')}</dd>` : ''}
      ${s.license ? `<dt>授權</dt><dd>${esc(s.license)}</dd>` : ''}
    </dl>`;
  d.classList.add('open');
  d.setAttribute('aria-hidden', 'false');
  document.getElementById('scrim').classList.add('open');
  d.scrollTop = 0;
  d.focus();
  history.replaceState(null, '', `#${encodeURIComponent(id)}`);
}
function closeDrawer() {
  const d = document.getElementById('drawer');
  d.classList.remove('open');
  d.setAttribute('aria-hidden', 'true');
  document.getElementById('scrim').classList.remove('open');
  history.replaceState(null, '', location.pathname + location.search);
}

// ---- 事件 ----
function setFilter(f) { state.filter = f; renderChips(); renderList(); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-filter],[data-rule],[data-id],[data-close],[data-copy]');
  if (!t) return;
  if (t.dataset.copy !== undefined) { navigator.clipboard?.writeText(t.dataset.copy); t.textContent = '已複製'; setTimeout(() => (t.textContent = '複製'), 1200); return; }
  if (t.dataset.close !== undefined) return closeDrawer();
  if (t.dataset.rule !== undefined) { e.preventDefault(); state.rule = t.dataset.rule; state.filter = 'all'; renderChips(); renderList(); if (state.rule) document.getElementById('list').scrollIntoView({ behavior: 'smooth' }); return; }
  if (t.dataset.filter !== undefined) return setFilter(t.dataset.filter);
  if (t.dataset.id) openDrawer(t.dataset.id);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDrawer();
  if (e.key === 'Enter' && e.target.dataset?.id) openDrawer(e.target.dataset.id);
});
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value.trim(); renderList(); });
document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; try { localStorage.setItem('skillhub.sort', state.sort); } catch {} renderList(); });
document.getElementById('source').addEventListener('change', (e) => { state.source = e.target.value; renderList(); });
document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('skillhub.theme', root.dataset.theme); } catch {}
});

try {
  const th = localStorage.getItem('skillhub.theme'); if (th) document.documentElement.dataset.theme = th;
  const so = localStorage.getItem('skillhub.sort'); if (so && sorters[so]) state.sort = so;
} catch {}
document.getElementById('sort').value = state.sort;
renderTop(); renderChips(); renderList(); renderSide();
if (location.hash) openDrawer(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
